target-version = "py311"
line-length = 88

exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
]

[lint]
# Keep baseline behavior explicit and predictable.
# Equivalent to Ruff defaults (no surprise mass refactors).
select = ["E4", "E7", "E9", "F"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
